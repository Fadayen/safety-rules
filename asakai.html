ピックアップルートに変更するなど、安全第一を徹底する。人事部はSPを発行した。",null,"Intan/Anisa","HR",null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null]},{"excelRow":738,"cells":[null,null,null,"Irsyad QA Boncengan tidak menggunakan Helm, disimpan ditempat penitipan motor, motor tsb tidak dibawa ke PT karena klaksonnya mati tidak standar, rencananya naik jemputan, jaraknya juga tidak jauh, kenapa karyawan tidak naik dititik jemputan (parkir hpm)-sacho.","Irsyad QA 乗客はヘルメットを着用しておらず、バイク保管エリアに保管されていました。バイクはホーンが標準仕様ではなかったためPTに持ち込まれませんでした。ピックアップする予定でしたが、距離は遠くありませんでした。なぜ従業員はピックアップポイント（hpm駐車場）で乗車しなかったのですか？ - sacho。","Selalu menggunakan helm baik sendiri maupun boncengan, segera memperbaiki klakson motor","一人で乗る場合でも、同乗者がいる場合でも、必ずヘルメットを着用してください。バイクのホーンはすぐに修理してください。",null,"Irsyad/Latif","QA",null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null]},{"excelRow":739,"cells":[null,null,null,"Rifai QA memboncengin teman tidak pakai helm, dikarenakan diberhentikan dan tidak enak hati dan jaraknya juga tidak jahuh, teman tsb dititipkan motornya dikarenakan tidak standar","Rifai QA はヘルメットを着用せずに友人のバイクの後部座席に乗っていましたが、停車して不安を感じ、距離も遠くなかったため、友人のバイクは標準ではなかったので、彼の管理下に置かれました。","tidak memboncengi teman yang tidak bawa helm,","ヘルメットを着用していない友人のバイクの後部座席に乗らないでください。",null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null]},{"excelRow":740,"cells":[null,null,null,"Sacho-Mohon pemikirannya dirubah tidak bawa helm, tidak apa2 tidak mematuhi peraturan. di PT. Advic leader mengecheck setiap jamnya yang dilakukan oleh operator tsb, ada check sheetnya. jika ada yang kurang langsung dilakukan perbaikan, saya ingin diterapkan di TRID disemua departemen dan dilaporkan diminggu depan, dan mengecheck safetynya dan perbaikannya juga","サチョさん、ヘルメットを着用しないという考えを改めてください。規則に従わなくても構いません。PT. Advicでは、リーダーが作業員の作業を1時間ごとにチェックし、チェックシートを使っています。不備があれば、すぐに改善します。TRIDにすべての部署で導入し、来週報告してほしいです。また、安全性と改善状況も確認してほしいです。",null,null,null,null,null,null,null,null,null,null,null,nul const PAGE_SIZE = 40;
let active = 0, page = 1;
const $ = id => document.getElementById(id);
const clean = v => (v === null || v === undefined) ? "" : String(v);
function renderTabs(){
  $("tabs").innerHTML = DATA.map((s,i)=>`<button class="tab ${i===active?'active':''}" data-i="${i}">${s.name}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{active=Number(b.dataset.i);page=1;renderTabs();renderTable()}));
}
function filteredRows(){
 const q=$("search").value.trim().toLowerCase();
 return DATA[active].rows.filter(row=>!q||row.cells.some(v=>clean(v).toLowerCase().includes(q)));
}
function renderTable(){
 const sheet=DATA[active], rows=filteredRows(), total=rows.length, pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
 page=Math.min(page,pages);
 $("sheetTitle").textContent="Asakai - "+sheet.name;
 $("rowInfo").textContent=`${total.toLocaleString("id-ID")} catatan`;
 $("resultCount").textContent=total.toLocaleString("id-ID");
 $("pageInfo").textContent=`Halaman ${page} dari ${pages}`;
 $("prev").disabled=page<=1;$("next").disabled=page>=pages;
 if(!sheet.headers.length || !total){$("tableArea").innerHTML='<div class="empty">Belum ada data pada sheet ini.</div>';return;}
 const visible=rows.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);
 let out='<table><thead><tr>'+sheet.headers.map(h=>`<th>${escapeHtml(h.name)}</th>`).join("")+'</tr></thead><tbody>';
 for(const row of visible){
   out+='<tr>'+sheet.headers.map(h=>`<td>${escapeHtml(clean(row.cells[h.index]))}</td>`).join("")+'</tr>';
 }
 out+='</tbody></table>';$("tableArea").innerHTML=out;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$("search").addEventListener("input",()=>{page=1;renderTable()});
$("prev").addEventListener("click",()=>{if(page>1){page--;renderTable()}});
$("next").addEventListener("click",()=>{page++;renderTable()});
$("totalRows").textContent=DATA.reduce((n,s)=>n+s.rows.length,0).toLocaleString("id-ID");
$("totalSheets").textContent=DATA.length;
renderTabs();renderTable();
</script>
